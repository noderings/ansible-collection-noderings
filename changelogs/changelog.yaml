ancestor: null
releases:
  0.1.0:
    changes:
      release_summary: 'First release of the ``noderings.cloud`` collection. It orders
        and manages NodeRings virtual machines,

        DNS, firewalls, access control and game servers, and adds a dynamic inventory
        of NodeRings servers.'
    fragments:
    - 0.1.0.yml
    modules:
    - description: Read a NodeRings organization's credit, subscriptions and plan
        limits.
      name: billing_info
      namespace: ''
    - description: List the operating systems NodeRings virtual machines can run.
      name: distro_info
      namespace: ''
    - description: Manage geo\-routed DNS records in a NodeRings zone.
      name: dns_geo_record
      namespace: ''
    - description: Manage DNS records in a NodeRings zone.
      name: dns_record
      namespace: ''
    - description: List DNS records in a NodeRings zone.
      name: dns_record_info
      namespace: ''
    - description: Manage NodeRings DNS zones and DNSSEC.
      name: dns_zone
      namespace: ''
    - description: List NodeRings DNS zones.
      name: dns_zone_info
      namespace: ''
    - description: Manage environment variables in a NodeRings organization.
      name: environment_variable
      namespace: ''
    - description: Manage NodeRings firewall address groups.
      name: firewall_address_group
      namespace: ''
    - description: Manage NodeRings firewall rulesets and their rules.
      name: firewall_ruleset
      namespace: ''
    - description: List NodeRings firewall rulesets and address groups.
      name: firewall_ruleset_info
      namespace: ''
    - description: Order and manage NodeRings game servers.
      name: game_server
      namespace: ''
    - description: Take, lock and delete backups of a NodeRings game server.
      name: game_server_backup
      namespace: ''
    - description: Manage databases of a NodeRings game server.
      name: game_server_database
      namespace: ''
    - description: List the games a NodeRings game\-server plan can run.
      name: game_server_game_info
      namespace: ''
    - description: List NodeRings game servers.
      name: game_server_info
      namespace: ''
    - description: Manage IAM groups and their members in a NodeRings organization.
      name: group
      namespace: ''
    - description: List users, groups, roles, service accounts and permissions of
        a NodeRings organization.
      name: iam_info
      namespace: ''
    - description: List NodeRings instant apps (one\-click applications).
      name: instant_app_info
      namespace: ''
    - description: List add\-ons sold on the NodeRings marketplace.
      name: marketplace_addon_info
      namespace: ''
    - description: Find NodeRings marketplace offers for a plan code in a city.
      name: marketplace_offer_info
      namespace: ''
    - description: List plan codes sold on the NodeRings marketplace, or read one
        plan.
      name: marketplace_plan_info
      namespace: ''
    - description: List NodeRings hosting providers, or read one provider's catalog.
      name: marketplace_provider_info
      namespace: ''
    - description: List the cities where the NodeRings marketplace has offers.
      name: marketplace_region_info
      namespace: ''
    - description: Get the NodeRings organization the token acts in.
      name: organization_info
      namespace: ''
    - description: Manage custom IAM roles in a NodeRings organization.
      name: role
      namespace: ''
    - description: Give a NodeRings user, group or service account its role.
      name: role_assignment
      namespace: ''
    - description: Manage secrets in a NodeRings organization.
      name: secret
      namespace: ''
    - description: Manage SSH keys in a NodeRings organization.
      name: ssh_key
      namespace: ''
    - description: List SSH keys in a NodeRings organization.
      name: ssh_key_info
      namespace: ''
    - description: Order and manage NodeRings virtual machines.
      name: virtual_machine
      namespace: ''
    - description: Add or remove additional IPv4 addresses on a NodeRings virtual
        machine.
      name: virtual_machine_additional_ip
      namespace: ''
    - description: Turn automatic backups of a NodeRings virtual machine on or off.
      name: virtual_machine_backup
      namespace: ''
    - description: List NodeRings virtual machines.
      name: virtual_machine_info
      namespace: ''
    - description: Take and delete snapshots of NodeRings virtual machines.
      name: virtual_machine_snapshot
      namespace: ''
    plugins:
      inventory:
      - description: NodeRings virtual machines as an Ansible inventory.
        name: noderings
        namespace: null
    release_date: '2026-11-24'
