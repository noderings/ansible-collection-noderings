name: Release

# Push a tag such as v0.1.0 whose version matches galaxy.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: pip install ansible-core
      - name: Check the tag matches galaxy.yml
        run: |
          version=$(python -c "import yaml; print(yaml.safe_load(open('galaxy.yml'))['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "galaxy.yml says ${version}, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: Build
        run: ansible-galaxy collection build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Release notes are in CHANGELOG.rst: https://github.com/noderings/ansible-collection-noderings/blob/${GITHUB_REF_NAME}/CHANGELOG.rst"
          gh release create "${GITHUB_REF_NAME}" noderings-cloud-*.tar.gz --title "${GITHUB_REF_NAME}" --notes "${notes}"
      - name: Publish to Ansible Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        if: env.GALAXY_API_KEY != ''
        run: ansible-galaxy collection publish noderings-cloud-*.tar.gz --api-key "${GALAXY_API_KEY}"
