---
# Runs against the real NodeRings API. Needs NODERINGS_TOKEN, and for DNS a parent domain in
# noderings_test_domain (default example.com). Creates and deletes test resources; DNS, firewall and IAM are free.
# The IAM target adds and removes the service account named in noderings_test_service_account to a test group.
- ansible.builtin.set_fact:
    sfx: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=8) }}"
- block:
  - noderings.cloud.iam_info:
      gather_subset:
      - permissions
      permission_filter: VirtualMachine
    register: perms
  - ansible.builtin.assert:
      that:
      - perms.permissions | length > 0
  - noderings.cloud.role:
      name: "ans-role-{{ sfx }}"
      description: test
      permissions:
      - ListVirtualMachines
      - GetVirtualMachine
    register: r1
  - noderings.cloud.role:
      name: "ans-role-{{ sfx }}"
      description: test
      permissions:
      - GetVirtualMachine
      - ListVirtualMachines
    register: r2
  - ansible.builtin.assert:
      that:
      - r1.changed
      - not r2.changed
      - r1.role.permissions == ['GetVirtualMachine','ListVirtualMachines']
  - noderings.cloud.role:
      name: "ans-role-{{ sfx }}"
      description: changed
      permissions:
      - ListDnsZones
      purge_permissions: false
    register: r3
    diff: true
  - ansible.builtin.assert:
      that:
      - r3.changed
      - r3.role.permissions | length == 3
      - r3.role.description == 'changed'
  - noderings.cloud.role:
      name: "ans-role-{{ sfx }}"
      permissions:
      - ListDnsZones
    register: r4
  - ansible.builtin.assert:
      that:
      - r4.changed
      - r4.role.permissions == ['ListDnsZones']
  - noderings.cloud.role:
      name: Viewer
      description: x
    register: bi
    ignore_errors: true
  - ansible.builtin.assert:
      that:
      - bi.failed
  - noderings.cloud.group:
      name: "ans-grp-{{ sfx }}"
      description: test
      service_accounts:
      - "{{ noderings_test_service_account }}"
    register: g1
  - noderings.cloud.group:
      name: "ans-grp-{{ sfx }}"
      description: test
      service_accounts:
      - "{{ noderings_test_service_account }}"
    register: g2
  - ansible.builtin.assert:
      that:
      - g1.changed
      - not g2.changed
      - g1.group.service_accounts == [noderings_test_service_account]
  - noderings.cloud.role_assignment:
      group: "ans-grp-{{ sfx }}"
      role: "ans-role-{{ sfx }}"
    register: a1
  - noderings.cloud.role_assignment:
      group: "ans-grp-{{ sfx }}"
      role: "ans-role-{{ sfx }}"
    register: a2
  - ansible.builtin.assert:
      that:
      - a1.changed
      - not a2.changed
  - noderings.cloud.group:
      name: "ans-grp-{{ sfx }}"
      service_accounts: []
    register: g3
  - ansible.builtin.assert:
      that:
      - g3.changed
      - g3.group.service_accounts == []
  - noderings.cloud.secret:
      key: "ANS_SECRET_{{ sfx | upper }}"
      value: s3cret
    register: s1
  - noderings.cloud.secret:
      key: "ANS_SECRET_{{ sfx | upper }}"
      value: s3cret
      update_value: on_create
    register: s2
  - noderings.cloud.secret:
      key: "ANS_SECRET_{{ sfx | upper }}"
      value: other
    register: s3
  - ansible.builtin.assert:
      that:
      - s1.changed
      - not s2.changed
      - s3.changed
  - noderings.cloud.environment_variable:
      key: "ANS_ENV_{{ sfx | upper }}"
      value: one
    register: e1
  - noderings.cloud.environment_variable:
      key: "ANS_ENV_{{ sfx | upper }}"
      value: one
    register: e2
  - noderings.cloud.environment_variable:
      key: "ANS_ENV_{{ sfx | upper }}"
      value: two
    register: e3
  - ansible.builtin.assert:
      that:
      - e1.changed
      - not e2.changed
      - e3.changed
  - noderings.cloud.iam_info:
      gather_subset:
      - users
      - groups
      - roles
      - service_accounts
      - secrets
      - environment_variables
    register: iam
  - ansible.builtin.assert:
      that:
      - iam.secrets | selectattr('key','equalto','ans_secret_' + sfx) | list | length == 1
      - iam.environment_variables | selectattr('value','equalto','two') | list | length == 1
      - iam.users | length > 0
  always:
  - noderings.cloud.secret:
      key: "ANS_SECRET_{{ sfx | upper }}"
      state: absent
    register: sd
  - noderings.cloud.environment_variable:
      key: "ANS_ENV_{{ sfx | upper }}"
      state: absent
    register: ed
  - noderings.cloud.group:
      name: "ans-grp-{{ sfx }}"
      state: absent
    register: gd
  - noderings.cloud.role:
      name: "ans-role-{{ sfx }}"
      state: absent
    register: rd
  - noderings.cloud.role:
      name: "ans-role-{{ sfx }}"
      state: absent
    register: rd2
  - ansible.builtin.assert:
      that:
      - sd.changed
      - ed.changed
      - gd.changed
      - rd.changed
      - not rd2.changed
