---
- ansible.builtin.set_fact:
    secret_key: "{{ noderings_prefix | upper | replace('-', '_') }}"
- name: Create (check mode)
  noderings.cloud.secret: {key: "{{ secret_key }}", value: first-value}
  check_mode: true
  register: result
- ansible.builtin.assert:
    that: result is changed
- name: Create
  noderings.cloud.secret: {key: "{{ secret_key }}", value: first-value}
  register: created
- name: Keys are case-insensitive; only set on create
  noderings.cloud.secret: {key: "{{ secret_key | lower }}", value: first-value, update_value: on_create}
  register: on_create
- name: Rewrite the value
  noderings.cloud.secret: {key: "{{ secret_key }}", value: second-value}
  register: rewritten
- ansible.builtin.assert:
    that:
      - created is changed
      - on_create is not changed
      - rewritten is changed
      - "'first-value' not in (created | string) and 'second-value' not in (rewritten | string)"
- name: Delete
  noderings.cloud.secret: {key: "{{ secret_key }}", state: absent}
  register: deleted
- noderings.cloud.secret: {key: "{{ secret_key }}", state: absent}
  register: deleted_again
- ansible.builtin.assert:
    that:
      - "deleted is changed"
      - "deleted_again is not changed"
