---
# Runs against the real NodeRings API. Needs NODERINGS_TOKEN, and for DNS a parent domain in
# noderings_test_domain (default example.com). Creates and deletes test resources; DNS, firewall and IAM are free.
- ansible.builtin.set_fact:
    zone: "ansible-test-{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=8) }}.{{ noderings_test_domain | default('example.com') }}"
- noderings.cloud.dns_zone:
    name: "{{ zone }}"
  register: z
- ansible.builtin.assert:
    that:
    - z.changed
    - z.zone.id | length > 0
- noderings.cloud.dns_zone:
    name: "{{ zone | upper }}."
  register: z2
- ansible.builtin.assert:
    that:
    - not z2.changed
- noderings.cloud.dns_record:
    zone: "{{ zone }}"
    name: www
    type: A
    ttl: 300
    values:
    - 203.0.113.10
    - 203.0.113.11
  register: r
- ansible.builtin.debug: var=r.record
- noderings.cloud.dns_record:
    zone: "{{ zone }}"
    name: "www.{{ zone }}"
    type: A
    ttl: 300
    values:
    - 203.0.113.11
    - 203.0.113.10
  register: r2
- ansible.builtin.assert:
    that:
    - not r2.changed
- noderings.cloud.dns_record:
    zone: "{{ zone }}"
    name: '@'
    type: MX
    values:
    - 10 mail.{{ noderings_test_domain | default('example.com') }}
    - 20 mx2.{{ noderings_test_domain | default('example.com') }}.
  register: mx
- noderings.cloud.dns_record:
    zone: "{{ zone }}"
    name: '@'
    type: MX
    values:
    - 10 mail.{{ noderings_test_domain | default('example.com') }}.
    - 20 mx2.{{ noderings_test_domain | default('example.com') }}.
  register: mx2
- ansible.builtin.assert:
    that:
    - mx.changed
    - not mx2.changed
- noderings.cloud.dns_record:
    zone: "{{ zone }}"
    name: '@'
    type: TXT
    values:
    - "{{ 'x' * 300 }}"
    - v=spf1 include:"q" -all
  register: txt
- noderings.cloud.dns_record:
    zone: "{{ zone }}"
    name: '@'
    type: TXT
    values:
    - v=spf1 include:"q" -all
    - "{{ 'x' * 300 }}"
  register: txt2
- ansible.builtin.assert:
    that:
    - txt.changed
    - not txt2.changed
    - txt.record['values'] | length == 2
- noderings.cloud.dns_record:
    zone: "{{ zone }}"
    name: '@'
    type: TXT
    values:
    - extra
    append: true
  register: app
- ansible.builtin.assert:
    that:
    - app.changed
    - app.record['values'] | length == 3
- noderings.cloud.dns_record:
    zone: "{{ zone }}"
    name: '@'
    type: TXT
    values:
    - extra
    append: true
    state: absent
  register: rem
- ansible.builtin.assert:
    that:
    - rem.changed
    - rem.record['values'] | length == 2
- noderings.cloud.dns_record:
    zone: "{{ zone }}"
    name: www
    type: A
    ttl: 600
    values:
    - 203.0.113.12
  check_mode: true
  diff: true
  register: chk
- ansible.builtin.assert:
    that:
    - chk.changed
- noderings.cloud.dns_record_info:
    zone: "{{ zone }}"
    name: www
    type: A
  register: ri
- ansible.builtin.assert:
    that:
    - ri.records[0]['values'] | sort == ['203.0.113.10','203.0.113.11']
- noderings.cloud.dns_record:
    zone: "{{ zone }}"
    name: bad
    type: CNAME
    values:
    - a.{{ noderings_test_domain | default('example.com') }}.
    - b.{{ noderings_test_domain | default('example.com') }}.
  register: bad
  ignore_errors: true
- ansible.builtin.assert:
    that:
    - bad.failed
- noderings.cloud.dns_geo_record:
    zone: "{{ zone }}"
    name: app
    type: A
    default: 203.0.113.10
    continents:
      EU: 198.51.100.20
    countries:
      jp: 192.0.2.30
  register: g
- ansible.builtin.debug: var=g.geo_record
- noderings.cloud.dns_geo_record:
    zone: "{{ zone }}"
    name: app
    type: A
    default: 203.0.113.10
    continents:
      EU: 198.51.100.20
    countries:
      JP: 192.0.2.30
  register: g2
- ansible.builtin.assert:
    that:
    - g.changed
    - not g2.changed
- noderings.cloud.dns_geo_record:
    zone: "{{ zone }}"
    name: app
    type: A
    state: absent
  register: g3
- ansible.builtin.assert:
    that:
    - g3.changed
- noderings.cloud.dns_zone:
    name: "{{ zone }}"
    dnssec: true
  register: sec
- ansible.builtin.debug: var=sec.dnssec
- noderings.cloud.dns_zone:
    name: "{{ zone }}"
    dnssec: true
  register: sec2
- ansible.builtin.assert:
    that:
    - sec.changed
    - not sec2.changed
    - sec.dnssec.ds | length > 0
- noderings.cloud.dns_zone:
    name: "{{ zone }}"
    dnssec: false
  register: sec3
- ansible.builtin.assert:
    that:
    - sec3.changed
    - sec3.dnssec.mode == 'unsigned'
- noderings.cloud.dns_zone_info:
    name: "{{ zone }}"
    include_dnssec: true
  register: zi
- ansible.builtin.assert:
    that:
    - zi.zones | length == 1
- noderings.cloud.dns_record:
    zone: "{{ zone }}"
    name: www
    type: A
    state: absent
  register: d
- noderings.cloud.dns_record:
    zone: "{{ zone }}"
    name: www
    type: A
    state: absent
  register: d2
- ansible.builtin.assert:
    that:
    - d.changed
    - not d2.changed
- noderings.cloud.dns_zone:
    name: "{{ zone }}"
    state: absent
  check_mode: true
  register: zchk
- ansible.builtin.assert:
    that:
    - zchk.changed
- noderings.cloud.dns_zone:
    name: "{{ zone }}"
    state: absent
  register: zdel2
- noderings.cloud.dns_zone:
    name: "{{ zone }}"
    state: absent
  register: zdel3
- ansible.builtin.assert:
    that:
    - zdel2.changed
    - not zdel3.changed
